<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial;
      background: linear-gradient(to bottom, #e5e5ea, #f5f5f7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 18px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #d2d2d7;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #0071e3;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #0071e3;
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #005bb5;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Sign in</h2>

    <input type="text" placeholder="Email or Phone">
    <input type="password" placeholder="Password">

    <button>Continue</button>

    <div class="footer">
      Forgot password?
    </div>
  </div>

</body>
</html>
